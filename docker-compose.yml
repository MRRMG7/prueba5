services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: logistica_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: password123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./data/baseDatos_corregido-v2.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: on-failure
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://app_user:password123@db:3306/logistica_db

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8001:3000"
    volumes:
      - ./frontend-react/src:/app/src

volumes:
  db_data:
